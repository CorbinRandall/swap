[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swap-onboard"
version = "0.1.0"
description = "A tiny Windows and macOS selector for Logitech onboard mouse profiles"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["hidapi>=0.14.0"]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10.0"]
build = ["py2app>=0.28; sys_platform == 'darwin'", "pyinstaller>=6.0; sys_platform == 'win32'", "pillow>=10.0"]

[project.scripts]
swap = "swap.app:main"

[tool.setuptools.packages.find]
include = ["swap*"]
